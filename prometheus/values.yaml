kube-prometheus-stack:
  controller:
    service:
      type: NodePort
    replicaCount: 1

  prometheus:
    prometheusSpec:
      # Cap disk usage below the PVC size so the volume never fills
      retention: 10d
      retentionSize: 8GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    alertmanagerSpec:
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi

  grafana:
    replicas: 1
    # RWO Longhorn volume: stop the old pod before starting the new one
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      type: pvc
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      size: 2Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
    adminUser: admin
    adminPassword: Frame-But-Near-Mention-1
    # admin:
    #   existingSecret: grafana-secrets
    #   userKey: admin-user
    #   passwordKey: admin-password