# grafana on the shared Gateway (nginx-gateway/homelab-gateway, managed in
# pi-cluster/terraform-argocd/gateway.tf). Wildcard TLS and HTTP->HTTPS
# redirect come from the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: prometheus
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - grafana.kinexa.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-grafana
          port: 80
