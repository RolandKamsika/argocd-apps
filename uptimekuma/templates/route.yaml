# uptimekuma on the shared Gateway (nginx-gateway/homelab-gateway, managed in
# pi-cluster/terraform-argocd/gateway.tf). Wildcard TLS and HTTP->HTTPS
# redirect come from the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptimekuma
  namespace: uptimekuma
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - uptimekuma.kinexa.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: uptimekuma-uptime-kuma
          port: 3001
---
# Long-lived websocket connections - replaces nginx proxy-read/send-timeout: 3600
apiVersion: gateway.nginx.org/v1alpha1
kind: ProxySettingsPolicy
metadata:
  name: uptimekuma-timeouts
  namespace: uptimekuma
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: uptimekuma
  timeout:
    read: 3600s
    send: 3600s
