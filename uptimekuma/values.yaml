uptime-kuma:
  image:
    tag: "2.2.1"
    
  password: "changeme"

  # Persist data on Longhorn (explicit, rather than relying on the default class)
  volume:
    enabled: true
    accessMode: ReadWriteOnce
    size: 4Gi
    storageClassName: longhorn

  # Exposed via templates/route.yaml on the shared Gateway (Gateway API)
  ingress:
    enabled: false
