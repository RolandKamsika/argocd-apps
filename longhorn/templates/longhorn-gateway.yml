# Gateway (NGINX Gateway Fabric). cert-manager watches the annotation and
# issues the "longhorn-tls" certificate for the HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: longhorn-gateway
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      hostname: longhorn.kinexa.co.uk
    - name: https
      port: 443
      protocol: HTTPS
      hostname: longhorn.kinexa.co.uk
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: longhorn-tls
---
# HTTPS -> Longhorn UI
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: longhorn-gateway
      sectionName: https
  hostnames:
    - longhorn.kinexa.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
---
# HTTP -> HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-redirect
  namespace: longhorn-system
spec:
  parentRefs:
    - name: longhorn-gateway
      sectionName: http
  hostnames:
    - longhorn.kinexa.co.uk
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Large uploads (backing images) - replaces nginx proxy-body-size: 10000m
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: longhorn-upload-size
  namespace: longhorn-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: longhorn
  body:
    maxSize: 10g
