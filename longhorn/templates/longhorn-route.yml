# Longhorn UI on the shared Gateway (nginx-gateway/homelab-gateway, managed
# in pi-cluster/terraform-argocd/gateway.tf). TLS is the shared wildcard
# certificate; HTTP->HTTPS redirect is handled by the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - longhorn.kinexa.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
---
# Large uploads (backing images) - replaces nginx proxy-body-size: 10000m
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: longhorn-upload-size
  namespace: longhorn-system
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: longhorn
  body:
    maxSize: 10g
