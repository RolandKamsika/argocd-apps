# pihole on the shared Gateway (nginx-gateway/homelab-gateway, managed in
# pi-cluster/terraform-argocd/gateway.tf). Wildcard TLS and HTTP->HTTPS
# redirect come from the shared Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole
  namespace: pihole
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - pihole2.kinexa.co.uk
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pihole-web
          port: 80
